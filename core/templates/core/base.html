{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}My Website{% endblock %}</title>

    <link rel="stylesheet"
          href="{% static 'core/css/style.css' %}">
</head>

<body>

    <nav>
        <h2>My Django Website</h2>

        <a href="{% url 'home' %}">Home</a>

        <a href="{% url 'about' %}">About</a>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Created while learning Django - 2026</p>
    </footer>

</body>
</html>
